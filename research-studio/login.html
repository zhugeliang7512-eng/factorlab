<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>登录 · FactorLab</title>
  <link rel="stylesheet" href="releases/a64d885079dc92e3/auth.css"><script defer src="releases/a64d885079dc92e3/vendor/supabase-2.118.0.js"></script><script defer src="releases/a64d885079dc92e3/cloud-config.js"></script><script defer src="releases/a64d885079dc92e3/cloud.js"></script><script defer src="releases/a64d885079dc92e3/auth.js"></script>
<meta name="factorlab-hosting" content="static"><meta name="factorlab-version" content="a64d885079dc92e3"></head>
<body class="auth-page">
  <header class="auth-header"><a class="auth-brand" href="./#/portfolio" aria-label="FactorLab">FactorLab<span>ALLOCATION STUDIO</span></a><label class="auth-language-label"><span class="sr-only">Language</span><select id="auth-language" aria-label="语言 Language"><option value="zh-CN">中文</option><option value="en">English</option></select></label></header>
  <main class="auth-shell">
    <section class="auth-form-panel" aria-labelledby="auth-title">
      <div class="auth-form-content">
        <p class="auth-eyebrow" data-zh="从一次配置开始" data-en="START WITH AN ALLOCATION">从一次配置开始</p>
        <h1 id="auth-title">欢迎回来</h1><p id="auth-subtitle">继续你的投资练习。</p>
        <div id="auth-status" class="auth-status" role="status" aria-live="polite"></div>
        <form id="auth-form" novalidate>
          <div id="email-field" class="auth-field"><label id="email-label" for="auth-email">邮箱</label><input id="auth-email" name="username" type="email" autocomplete="username" maxlength="254" required></div>
          <div id="code-field" class="auth-field" hidden><label for="auth-code" data-zh="邮箱验证码" data-en="Email code">邮箱验证码</label><input id="auth-code" name="code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="10"><button id="auth-resend" class="text-button" type="button">重新发送</button></div>
          <div id="password-field" class="auth-field"><div class="field-heading"><label id="password-label" for="auth-password">密码</label><button id="auth-forgot" class="text-button" type="button">忘记密码？</button></div><div class="password-input"><input id="auth-password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button id="auth-password-toggle" class="password-toggle" type="button" aria-controls="auth-password" aria-pressed="false">显示</button></div></div>
          <div id="confirm-field" class="auth-field" hidden><label for="auth-confirm-password" data-zh="确认密码" data-en="Confirm password">确认密码</label><div class="password-input"><input id="auth-confirm-password" name="password-confirm" type="password" autocomplete="new-password" maxlength="128"><button id="auth-confirm-toggle" class="password-toggle" type="button" aria-controls="auth-confirm-password" aria-pressed="false">显示</button></div></div>
          <button id="auth-submit" class="auth-primary" type="submit" disabled>登录</button>
        </form>
        <div class="auth-secondary"><span id="auth-switch-caption">还没有账号？</span><button id="auth-switch" class="text-button" type="button">创建账号</button><button id="auth-back" class="text-button" type="button" hidden>返回登录</button></div>
        <div class="auth-guest"><button id="auth-guest" class="text-button" type="button" data-zh="先以访客体验" data-en="Explore as a guest">先以访客体验</button><p data-zh="无需注册，进度保留在此浏览器。" data-en="No account needed. Progress stays in this browser.">无需注册，进度保留在此浏览器。</p></div>
      </div>
    </section>
    <aside class="video-panel" aria-label="FactorLab 角色动画">
      <div class="login-scene"><video id="login-animation" src="releases/a64d885079dc92e3/assets/login/welcome.mp4" poster="releases/a64d885079dc92e3/assets/login/poster.jpg" muted playsinline preload="metadata" aria-label="FactorLab 角色欢迎动画"></video><button id="animation-toggle" type="button" class="animation-toggle">播放动画</button></div>
      <div class="video-copy"><p data-zh="看懂配置，也看懂自己。" data-en="Understand your allocation. Discover your approach.">看懂配置，也看懂自己。</p><span data-zh="在模拟市场里，试一试你的想法。" data-en="Try your ideas in a simulated market.">在模拟市场里，试一试你的想法。</span></div>
    </aside>
  </main>
  <noscript>请启用 JavaScript 后登录，或打开支持 JavaScript 的浏览器。</noscript>
</body>
</html>
